[project]
name = "ai-engineering-analyzer"
version = "0.1.0"
description = "AI-powered engineering analyzer for public GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.16.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.0.1",
    "torch>=2.11.0",
    "uvicorn>=0.53.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
